name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Migrations and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickethub
          POSTGRES_PASSWORD: tickethub
          POSTGRES_DB: tickethub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickethub -d tickethub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://tickethub:tickethub@localhost:5432/tickethub
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations go up, match the models, and go back down
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t tickethub-api .

      - name: Build the development image and check the test tools are inside
        run: |
          docker build --build-arg INSTALL_DEV=true -t tickethub-api:dev .
          docker run --rm tickethub-api:dev pytest --version
